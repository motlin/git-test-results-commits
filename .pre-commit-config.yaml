repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          - id: check-yaml
            args: ["--allow-multiple-documents"]
          - id: check-json
          - id: check-toml
          - id: check-xml
          - id: end-of-file-fixer
          - id: trailing-whitespace
          - id: check-added-large-files
            args: ["--maxkb=1000"]
          - id: check-case-conflict
          - id: check-merge-conflict
          - id: detect-private-key
          - id: mixed-line-ending
            args: ["--fix=no"]

    - repo: local
      hooks:
          - id: just-fmt
            name: just --fmt
            entry: sh -c 'for file do just --fmt --justfile "$file" || exit; done' --
            language: system
            files: '(?i)(^|/)\.?justfile$|\.just$'
            types: [file]
          - id: cargo-fmt
            name: cargo fmt
            entry: cargo +nightly fmt --check
            language: system
            types: [rust]
            pass_filenames: false

          - id: oxfmt
            name: oxfmt-next-line
            entry: oxfmt-next-line --no-error-on-unmatched-pattern
            language: system
            # Show "Finished in Xms on N files" so every run proves formatting happened.
            verbose: true
