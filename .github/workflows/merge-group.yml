# Jobs that run on merge_group, meaning they must pass before changes land. They also run on pull_request.

on:
    pull_request:
    merge_group:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.x"
            - uses: jdx/mise-action@v4
            - run: rustup component add rustfmt
            - uses: pre-commit/action@v3.0.1

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/cache@v6
              with:
                  key: cargo-${{ hashFiles('**/Cargo.lock') }}
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  restore-keys: |
                      cargo-

            - uses: jdx/mise-action@v4

            - run: rustup component add rustfmt

            - run: just build

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/cache@v6
              with:
                  key: cargo-${{ hashFiles('**/Cargo.lock') }}
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  restore-keys: |
                      cargo-

            - uses: jdx/mise-action@v4

            - run: rustup component add rustfmt

            - run: just test

    prettier:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}

            - uses: jdx/mise-action@v4

            - name: "Prettier Format Check"
              run: prettier --check .

    biome:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}

            - uses: jdx/mise-action@v4

            - name: "Biome Format Check"
              run: npx @biomejs/biome ci

    reviewdog-markdownlint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: reviewdog/action-markdownlint@v0.27.0
              with:
                  reporter: github-pr-check
                  fail_on_error: true
                  filter_mode: nofilter

    reviewdog-yamllint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: reviewdog/action-yamllint@v1.23.0
              with:
                  reporter: github-pr-check
                  fail_on_error: true
                  filter_mode: nofilter

    reviewdog-actionlint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: reviewdog/action-actionlint@v1.72.0
              with:
                  reporter: github-pr-check
                  fail_on_error: true
                  filter_mode: nofilter

    all-checks:
        name: All checks
        if: ${{ !cancelled() }}
        needs:
            [pre-commit, build, test, prettier, biome, reviewdog-markdownlint, reviewdog-yamllint, reviewdog-actionlint]
        runs-on: ubuntu-latest
        steps:
            - uses: re-actors/alls-green@release/v1
              with:
                  jobs: ${{ toJSON(needs) }}
